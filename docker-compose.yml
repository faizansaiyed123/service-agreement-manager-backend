services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_agreements
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sam_dev_only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam -d service_agreements"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:-sam_dev_only}@db:5432/service_agreements
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  maintenance-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:-sam_dev_only}@db:5432/service_agreements
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "app.workers.maintenance"]
  notification-worker:
    build: .
    profiles: ["email"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:-sam_dev_only}@db:5432/service_agreements
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "app.workers.notifications"]
volumes:
  postgres_data:
