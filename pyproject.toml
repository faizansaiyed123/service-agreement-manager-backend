[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-agreement-manager-backend"
version = "0.1.0"
description = "Tenant-safe backend for HVAC and plumbing service agreements"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2", "email-validator>=2.1,<3", "fastapi>=0.115,<1",
  "PyJWT>=2.9,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1", "SQLAlchemy>=2.0,<3", "tzdata>=2024.1", "uvicorn[standard]>=0.30,<1",
]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.6,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
