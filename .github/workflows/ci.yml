name: backend-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service_agreements
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sam -d service_agreements"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sam:sam_test_password@localhost:5432/service_agreements
      APP_ENV: test
      JWT_SECRET_KEY: test-secret-with-more-than-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head
      - name: Verify PostgreSQL migration revision
        run: alembic current
      - name: Verify ORM and database schema are in sync
        run: alembic check
      - run: pytest
