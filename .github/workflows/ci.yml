name: backend-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: service_agreements
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sam -d service_agreements"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sam:sam_test_password@localhost:5432/service_agreements
      APP_ENV: test
      JWT_SECRET_KEY: test-secret-with-more-than-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head
      - name: Verify PostgreSQL migration revision
        run: alembic current
      - name: Verify ORM and database schema are in sync
        run: alembic check
      - run: pytest

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Start API and background workers
        run: docker compose --profile email up --build --wait -d
      - name: Verify database readiness through the API
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/health/ready"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          break
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"API readiness check failed: {last_error}")
          PY
      - name: Show service status
        run: docker compose --profile email ps
      - name: Tear down containers
        if: always()
        run: docker compose --profile email down -v
