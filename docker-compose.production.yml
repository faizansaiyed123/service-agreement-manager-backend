services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: service_agreements
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam -d service_agreements"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Intentionally not published to the host.

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  billing-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.billing"]

  webhook-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.webhooks"]

  maintenance-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.maintenance"]

  notification-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.workers.notifications"]

  sms-worker:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://sam:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/service_agreements
      STORAGE_ROOT: /srv/app/storage
    volumes:
      - attachments_data:/srv/app/storage
    depends_on:
      api:
        condition: service_healthy
    profiles: ["sms"]
    command: ["python", "-m", "app.workers.sms"]

volumes:
  postgres_data:
  attachments_data:
